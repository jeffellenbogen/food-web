<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Web Explorers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --journal-bg: #f5f0e1;
            --journal-border: #c4b5a0;
            --ink-color: #2b2624;
            --thread-gold: #d4af37;
            --highlight-glow: rgba(255, 255, 255, 1);
            --error-red: #a33b3b;
            --success-green: #3b7a3b;
            --pencil-blue: #4a7a96;
            --ribbon-blue: #2c5282;
            --ribbon-gold: #ffd700;
            --map-sea: #e5dfcf;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Patrick Hand', cursive;
            color: var(--ink-color);
            background-image: radial-gradient(#333 10%, transparent 10%);
            background-size: 20px 20px;
            overflow: hidden; 
        }

        .sketchbook {
            background-color: var(--journal-bg);
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            box-shadow: 15px 15px 50px rgba(0,0,0,0.8);
            border-left: 15px solid #3d2b1f;
            position: relative;
            height: 94vh; width: 96vw; max-width: 1400px;
            display: flex; flex-direction: column; transition: all 0.3s ease;
        }

        .spiral {
            position: absolute; left: -25px; top: 20px; bottom: 20px;
            display: flex; flex-direction: column; justify-content: space-around; z-index: 10;
        }
        .ring {
            width: 35px; height: 10px;
            background: linear-gradient(to bottom, #888, #eee, #888);
            border-radius: 10px; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .screen { display: none; height: 100%; flex-direction: column; overflow: hidden; position: relative; }
        .screen.active { display: flex; }

        .world-map-container {
            background-color: var(--map-sea);
            background-image: url("https://www.transparenttextures.com/patterns/old-map.png");
            height: 100%; width: 100%; position: relative;
            border: 2px solid #8c7e6a; border-radius: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .map-grid {
            position: absolute; inset: 0;
            background-size: 100px 100px;
            background-image: linear-gradient(to right, rgba(140, 126, 106, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(140, 126, 106, 0.1) 1px, transparent 1px);
        }

        .expedition-stamp {
            position: absolute; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 20;
        }
        .expedition-stamp:hover { transform: scale(1.15) rotate(-2deg); z-index: 30; }
        .stamp-visual {
            width: 140px; height: 140px; border-radius: 50%; border: 4px double #3d2b1f;
            padding: 10px; background: rgba(255,255,255,0.2);
            display: flex; items-center; justify-content: center; position: relative;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }
        .stamp-visual img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; filter: grayscale(0.4) sepia(0.3); }
        .stamp-label {
            background: #3d2b1f; color: #f5f0e1; padding: 4px 12px; font-family: 'Special Elite', cursive;
            font-size: 1rem; text-transform: uppercase; box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .patch-container { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; position: relative; }
        .patch-slot {
            width: 120px; height: 120px; border-radius: 50%; position: relative; cursor: pointer;
            transition: all 0.3s ease; background-color: #eee; border: 8px solid #3d2b1f;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3), inset 0 0 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .patch-slot:hover { transform: scale(1.1); border-color: #fff; box-shadow: 0 0 30px 10px var(--highlight-glow); }
        .patch-image { width: 100%; height: 100%; object-fit: cover; filter: saturate(1.4) contrast(1.1); display: block; }
        
        .patch-label {
            font-family: 'Special Elite', cursive; font-size: 0.85rem; text-transform: uppercase;
            letter-spacing: 0.05em; background: #fff; border: 1px solid #3d2b1f;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1); transform: rotate(-1deg); font-weight: bold;
            width: 140px; text-align: center; display: flex; align-items: center; 
            justify-content: center; line-height: 1.1; padding: 6px;
        }

        .btn-ink {
            border: 2px solid var(--ink-color); border-radius: 5px 15px 5px 10px / 10px 5px 15px 5px;
            padding: 0.6rem 1.2rem; transition: all 0.2s; font-weight: bold; background: transparent;
            font-family: 'Special Elite', cursive; font-size: 0.9rem; text-transform: uppercase;
        }
        .btn-ink:hover:not(.needs-check) { background: var(--ink-color); color: white; transform: translateY(-1px); }

        .needs-check {
            background-color: var(--ribbon-blue) !important; color: white !important;
            border: 3px solid var(--ribbon-gold) !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); transform: scale(1.05);
        }

        .trophic-shelf {
            border-bottom: 2px dashed rgba(0,0,0,0.1); flex: 1; min-height: 80px; position: relative;
            background-image: linear-gradient(to right, transparent 10%, rgba(0,0,0,0.01) 10%);
            background-size: 50px 100%; transition: background-color 0.2s;
        }
        .shelf-label {
            position: absolute; left: -10px; top: 10px; transform: rotate(-1.5deg);
            background: #fff9eb; padding: 3px 15px; border: 1px solid #dcd3bc;
            font-size: 0.7rem; font-weight: bold; text-transform: uppercase;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.05); z-index: 5; font-family: 'Special Elite', cursive;
        }
        .drop-zone { height: 100%; width: 100%; display: flex; flex-wrap: wrap; gap: 0.75rem; padding: 1.5rem 2rem 0.5rem 2rem; align-items: center; }

        .sidebar-item {
            transition: all 0.2s; background: #fff; border: 2px solid #3d2b1f;
            border-radius: 8px; user-select: none; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            position: relative; z-index: 20; padding: 0.6rem;
        }
        .sidebar-item[draggable="true"] { cursor: grab; }

        .mode-toggle-container {
            background: rgba(0,0,0,0.05); border: 2px solid #3d2b1f; border-radius: 10px;
            display: flex; position: relative; cursor: pointer; padding: 4px;
        }
        .mode-toggle-slider {
            position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px);
            background: var(--pencil-blue); border-radius: 6px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1;
        }
        .mode-toggle-slider.links-active { left: 50%; background: var(--success-green); }
        .mode-label { flex: 1; text-align: center; padding: 8px 0; font-family: 'Special Elite', cursive; font-size: 11px; z-index: 2; font-weight: bold; }
        .mode-label.active { color: white; }

        #connection-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
        .connection-arrow { fill: none; stroke: var(--pencil-blue); stroke-width: 3; stroke-linecap: round; marker-end: url(#arrowhead); opacity: 0.6; }
        #temp-link { fill: none; stroke: var(--pencil-blue); stroke-width: 2; stroke-dasharray: 5,5; pointer-events: none; }

        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 2rem;
        }
        .overlay.active { display: flex; }
        .modal-paper {
            background: #fff; max-width: 500px; width: 100%; padding: 2.5rem;
            border: 2px solid #3d2b1f; position: relative; box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
        }

        #modal-feedback .modal-paper { max-width: 460px; padding: 1.25rem 1.5rem; }

        .workspace-habitat-badge { width: 60px; height: 60px; border-radius: 50%; border: 4px solid #3d2b1f; position: relative; }
        .version-tag { font-family: 'Special Elite', cursive; opacity: 0.4; font-size: 12px; font-weight: bold; }
        .compass-rose { position: absolute; bottom: 40px; right: 40px; width: 150px; height: 150px; opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body class="p-2 md:p-4 flex justify-center items-center min-h-screen">

    <div id="journal-root" class="sketchbook p-6 md:p-10">
        <svg style="width:0; height:0; position:absolute;">
            <defs>
                <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pencil-blue)" />
                </marker>
            </defs>
        </svg>

        <div class="spiral">
            <div class="ring"></div><div class="ring"></div><div class="ring"></div>
            <div class="ring"></div><div class="ring"></div><div class="ring"></div>
            <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        </div>

        <header id="journal-header" class="flex justify-between items-center mb-6 border-b-2 border-stone-300 pb-3 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button id="btn-to-world" class="hidden btn-ink">&larr; Global Map</button>
                <button id="btn-to-cover" class="hidden btn-ink">&larr; Region Index</button>
                <div class="flex items-baseline">
                    <span id="user-name" class="handwritten text-4xl text-blue-900 border-b border-dashed border-stone-400 pl-4 min-w-[120px] outline-none text-right inline-block" contenteditable="true">Your Name</span>
                    <h1 class="text-4xl font-bold handwritten tracking-tight text-stone-800 ml-2">@ Food Web Explorers</h1>
                </div>
            </div>
            <div id="workspace-tools" class="hidden flex gap-3">
                <button id="btn-check" class="btn-ink bg-stone-800 text-white shadow-md">Check Journal</button>
            </div>
        </header>

        <!-- World Map Screen -->
        <div id="screen-world" class="screen active">
            <div class="world-map-container">
                <div class="map-grid"></div>
                <h2 class="text-6xl font-bold typewriter mb-2 px-12 py-3 bg-stone-800 text-white transform -rotate-1 z-10">Food Web Explorers</h2>
                <p class="typewriter opacity-60 mb-12 uppercase tracking-widest z-10">Select a region to begin expeditions</p>
                
                <div class="expedition-stamp" style="top: 30%; left: 15%;" onclick="app.selectRegion('colorado')">
                    <div class="stamp-visual"><img src="https://images.unsplash.com/photo-1499244015948-ac7a63e28aa2?auto=format&fit=crop&w=300"></div>
                    <span class="stamp-label">Colorado Rockies</span>
                </div>

                <div class="expedition-stamp" style="top: 55%; left: 52%;" onclick="app.selectRegion('nigeria')">
                    <div class="stamp-visual"><img src="https://images.unsplash.com/photo-1542366810-4316719859f5?auto=format&fit=crop&w=300"></div>
                    <span class="stamp-label">Nigeria Ecosystems</span>
                </div>

                <div class="compass-rose">
                    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="50" cy="50" r="45" stroke-dasharray="2 4"/><path d="M50 5 L55 45 L95 50 L55 55 L50 95 L45 55 L5 50 L45 45 Z" fill="#3d2b1f"/><text x="48" y="15" fill="#3d2b1f" font-family="serif" font-size="10">N</text>
                    </svg>
                </div>
            </div>
            <div class="version-tag mt-4 text-center">BUILD v2.1.2</div>
        </div>

        <!-- Regional Landing -->
        <div id="screen-cover" class="screen">
            <div class="flex flex-col items-center py-4 flex-grow overflow-y-auto">
                <h2 id="region-title" class="text-4xl font-bold typewriter mb-16 px-12 py-3 bg-stone-800 text-white transform rotate-1 uppercase tracking-widest">Region Habitats</h2>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-12 w-full max-w-5xl" id="patch-grid"></div>
                <div class="mt-auto pt-10 flex flex-col items-center w-full">
                    <div id="progress-summary" class="typewriter text-lg mb-4 font-bold">Earned 0 of 5 badges</div>
                    <button id="btn-export-journal" class="btn-ink text-xs opacity-70">Save Global Data</button>
                </div>
            </div>
            <div class="version-tag absolute bottom-4 left-1/2 -translate-x-1/2">v2.1.2</div>
        </div>

        <!-- Workspace -->
        <div id="screen-workspace" class="screen">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 relative flex-grow overflow-hidden">
                <svg id="connection-layer"><path id="temp-link" d=""></path></svg>
                <aside class="lg:col-span-1 flex flex-col h-full overflow-hidden border-r-2 border-stone-200">
                    <h3 class="font-bold text-3xl handwritten mb-1 px-4 pt-2 text-stone-700">Species</h3>
                    <p id="mode-hint" class="text-xs typewriter uppercase tracking-widest mb-2 px-4 pb-2 border-b border-stone-300">Drag to Sort</p>
                    <div id="organism-pool" class="space-y-3 overflow-y-auto p-4 flex-grow"></div>
                    <div class="p-4 space-y-3 flex-shrink-0">
                        <div class="mode-toggle-container" id="mode-switch">
                            <div id="mode-slider" class="mode-toggle-slider"></div>
                            <div id="label-arrange" class="mode-label active">Arrange</div>
                            <div id="label-links" class="mode-label inactive">Draw Links</div>
                        </div>
                        <button id="btn-clear-links" class="btn-ink w-full text-[10px]">Reset Energy Links</button>
                    </div>
                </aside>
                <main class="lg:col-span-3 flex flex-col h-full overflow-hidden">
                    <div class="flex items-center gap-4 mb-3 flex-shrink-0">
                        <div id="workspace-badge-container" class="workspace-habitat-badge"><div id="workspace-badge-img-host" class="w-full h-full rounded-full overflow-hidden"></div></div>
                        <h2 id="current-habitat-name" class="text-5xl handwritten text-stone-800 uppercase">Habitat</h2>
                    </div>
                    <div id="shelves-container" class="relative z-20 flex-grow flex flex-col overflow-hidden">
                        <div class="trophic-shelf" data-level="4"><span class="shelf-label">Tertiary</span><div class="drop-zone"></div></div>
                        <div class="trophic-shelf" data-level="3"><span class="shelf-label">Secondary</span><div class="drop-zone"></div></div>
                        <div class="trophic-shelf" data-level="2"><span class="shelf-label">Primary</span><div class="drop-zone"></div></div>
                        <div class="trophic-shelf" data-level="1"><span class="shelf-label">Producers</span><div class="drop-zone"></div></div>
                    </div>
                </main>
            </div>
            <div class="version-tag absolute bottom-4 left-1/2 -translate-x-1/2">v2.1.2</div>
        </div>

        <!-- Feedback Modal -->
        <div id="modal-feedback" class="overlay">
            <div class="modal-paper text-center">
                <h3 id="feedback-title" class="handwritten text-5xl mb-4">Review</h3>
                <div id="feedback-text" class="text-xl italic"></div>
                <button class="btn-ink mt-8 w-full closeModal">Return to Journal</button>
            </div>
        </div>
    </div>

                        { id: 'n16', name: 'Martial Eagle', level: 4, icon: '🦚', note: "The forest's highest raptor.", predators: [] }
                    ]},
                    savanna: { name: "Guinea Savanna", img: "https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=400", organisms: [
                        { id: 'n17', name: 'Elephant Grass', level: 1, icon: '🎍', note: "Fast-growing savanna cover.", predators: ['n19'] },
                        { id: 'n18', name: 'Baobab', level: 1, icon: '☘️', note: "Water-storing tree of life.", predators: ['n20'] },
                        { id: 'n19', name: 'Warthog', level: 2, icon: '🐗', note: "Savanna grazer and rooter.", predators: ['n21'] },
                        { id: 'n20', name: 'Elephant', level: 2, icon: '🐘', note: "Ecosystem engineer.", predators: ['n23'] },
                        { id: 'n21', name: 'Hyena', level: 3, icon: '🦴', note: "Powerful hunter-scavenger.", predators: ['n23'] },
                        { id: 'n22', name: 'Wild Dog', level: 3, icon: '🐕', note: "Highly social pack hunter.", predators: ['n23'] },
                        { id: 'n23', name: 'Lion', level: 4, icon: '🐯', note: "King of the grasslands.", predators: [] },
                        { id: 'n24', name: 'Vulture', level: 4, icon: '🦩', note: "Apex scavenger of the plains.", predators: [] }
                    ]},
                    river: { name: "Freshwater River", img: "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=400", organisms: [
                        { id: 'n25', name: 'Water Lily', level: 1, icon: '🪷', note: "Aquatic primary producer.", predators: ['n27'] },
                        { id: 'n26', name: 'Papyrus Reed', level: 1, icon: '🪴', note: "Wetland producer providing habitat.", predators: ['n28'] },
                        { id: 'n27', name: 'Freshwater Shrimp', level: 2, icon: '🦐', note: "Small scavenger consumer.", predators: ['n29'] },
                        { id: 'n28', name: 'Tilapia-R', level: 2, icon: '🐠', note: "River-dwelling herbivorous fish.", predators: ['n30'] },
                        { id: 'n29', name: 'Catfish', level: 3, icon: '🐡', note: "Bottom-feeding secondary consumer.", predators: ['n31'] },
                        { id: 'n30', name: 'Clawless Otter', level: 3, icon: '🐩', note: "Fish-eating mammal of the river.", predators: ['n31'] },
                        { id: 'n31', name: 'Croc-R', level: 4, icon: '🐢', note: "Freshwater apex predator.", predators: [] },
                        { id: 'n32', name: 'Eagle-R', level: 4, icon: '🦆', note: "River-scoping apex predator.", predators: [] }
                    ]},
                    sahel: { name: "Sahel Scrubland", img: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=400", organisms: [
                        { id: 'n33', name: 'Acacia', level: 1, icon: '🌿', note: "Hardy scrubland shrub.", predators: ['n35'] },
                        { id: 'n34', name: 'Doum Palm', level: 1, icon: '🥥', note: "Desert-fringe fruit producer.", predators: ['n36'] },
                        { id: 'n35', name: 'Dorcas Gazelle', level: 2, icon: '🦌', note: "Drought-adapted primary consumer.", predators: ['n37'] },
                        { id: 'n36', name: 'Desert Locust', level: 2, icon: '🦗', note: "Mass-migrating herbivore.", predators: ['n38'] },
                        { id: 'n37', name: 'Fennec Fox', level: 3, icon: '🦊', note: "Small desert secondary consumer.", predators: ['n39'] },
                        { id: 'n38', name: 'Goshawk-S', level: 3, icon: '🕊️', note: "Pale scrubland raptor.", predators: ['n40'] },
                        { id: 'n39', name: 'Python-S', level: 4, icon: '🐌', note: "Semi-arid constrictor predator.", predators: [] },
                        { id: 'n40', name: 'Caracal', level: 4, icon: '🐜', note: "The agile jumping apex cat.", predators: [] }
                    ]}
                }
            }
        };

        const app = {
            state: {
                currentScreen: 'world', currentRegion: null, activeHabitat: null, tool: 'arrange', linkingSource: null,
                regionsState: { colorado: { completed: [], hState: {} }, nigeria: { completed: [], hState: {} } }
            },

            init() {
                this.cacheDOM(); this.bindEvents();
                window.onmousemove = (e) => this.handleMouseMove(e);
                window.onmouseup = () => this.handleMouseUp();
                const nameField = document.getElementById('user-name');
                nameField.addEventListener('focus', () => setTimeout(() => document.execCommand('selectAll', false, null), 0));
            },

            cacheDOM() {
                this.screens = { world: document.getElementById('screen-world'), cover: document.getElementById('screen-cover'), workspace: document.getElementById('screen-workspace') };
                this.btnWorld = document.getElementById('btn-to-world'); this.btnCover = document.getElementById('btn-to-cover');
                this.btnCheck = document.getElementById('btn-check'); this.pool = document.getElementById('organism-pool');
                this.tempPath = document.getElementById('temp-link');
            },

            bindEvents() {
                this.btnWorld.onclick = () => this.goToScreen('world');
                this.btnCover.onclick = () => this.goToScreen('cover');
                document.getElementById('mode-switch').onclick = () => this.setTool(this.state.tool === 'arrange' ? 'links' : 'arrange');
                document.getElementById('btn-check').onclick = () => this.checkJournal();
                document.querySelectorAll('.closeModal').forEach(b => b.onclick = (e) => e.target.closest('.overlay').classList.remove('active'));
                document.getElementById('btn-clear-links').onclick = () => { if(this.state.activeHabitat) { this.state.regionsState[this.state.currentRegion].hState[this.state.activeHabitat].connections = []; this.drawArrows(); } };
            },

            goToScreen(id) {
                Object.keys(this.screens).forEach(k => this.screens[k].classList.toggle('active', k === id));
                this.btnWorld.classList.toggle('hidden', id === 'world');
                this.btnCover.classList.toggle('hidden', id !== 'workspace');
                document.getElementById('workspace-tools').classList.toggle('hidden', id !== 'workspace');
                if (id === 'cover') this.renderRegionHub();
            },

            selectRegion(id) { this.state.currentRegion = id; this.goToScreen('cover'); },

            renderRegionHub() {
                const reg = regions[this.state.currentRegion], rState = this.state.regionsState[this.state.currentRegion];
                document.getElementById('region-title').textContent = reg.title;
                const grid = document.getElementById('patch-grid'); grid.innerHTML = '';
                Object.keys(reg.habitats).forEach(hid => {
                    const h = reg.habitats[hid], mastered = rState.completed.includes(hid);
                    grid.insertAdjacentHTML('beforeend', `<div class="patch-container">${mastered ? getRibbonSVG(40,60,18) : ''}<div class="patch-slot" onclick="app.startHabitat('${hid}')"><img src="${h.img}" class="patch-image"></div><span class="patch-label">${h.name}</span></div>`);
                });
                document.getElementById('progress-summary').textContent = `Earned ${rState.completed.length} of ${Object.keys(reg.habitats).length} badges`;
            },

            startHabitat(id) {
                this.state.activeHabitat = id; const rState = this.state.regionsState[this.state.currentRegion];
                if (!rState.hState[id]) rState.hState[id] = { placements: {}, connections: [] };
                document.getElementById('current-habitat-name').textContent = regions[this.state.currentRegion].habitats[id].name;
                document.getElementById('workspace-badge-img-host').innerHTML = `<img src="${regions[this.state.currentRegion].habitats[id].img}" class="w-full h-full object-cover">`;
                this.setTool('arrange'); this.loadSpecies(); this.goToScreen('workspace'); this.drawArrows();
            },

            loadSpecies() {
                this.pool.innerHTML = ''; document.querySelectorAll('.drop-zone').forEach(z => z.innerHTML = '');
                const hData = regions[this.state.currentRegion].habitats[this.state.activeHabitat];
                const hState = this.state.regionsState[this.state.currentRegion].hState[this.state.activeHabitat];
                hData.organisms.forEach(org => {
                    const el = document.createElement('div'); el.className = 'sidebar-item flex items-center gap-3 bg-white border-2 border-stone-800 rounded';
                    el.dataset.id = org.id; el.innerHTML = `<span class="text-2xl">${org.icon}</span><span class="font-bold text-lg">${org.name}</span>`;
                    el.draggable = (this.state.tool === 'arrange');
                    el.ondragstart = (e) => e.dataTransfer.setData('text', org.id);
                    el.onmousedown = (e) => { if(this.state.tool === 'links') { this.state.linkingSource = org.id; e.stopPropagation(); } };
                    el.onmouseup = () => { if(this.state.tool === 'links' && this.state.linkingSource && this.state.linkingSource !== org.id) this.createLink(this.state.linkingSource, org.id); };
                    const shelf = hState.placements[org.id];
                    if (shelf) document.querySelector(`.trophic-shelf[data-level="${shelf}"] .drop-zone`).appendChild(el); else this.pool.appendChild(el);
                });
                document.querySelectorAll('.trophic-shelf').forEach(shelf => {
                    shelf.ondragover = (e) => e.preventDefault();
                    shelf.ondrop = (e) => {
                        const id = e.dataTransfer.getData('text'), el = document.querySelector(`[data-id="${id}"]`);
                        if (!el) return;
                        shelf.querySelector('.drop-zone').appendChild(el); hState.placements[id] = shelf.dataset.level; this.drawArrows();
                    };
                });
            },

            setTool(t) {
                this.state.tool = t;
                document.getElementById('mode-slider').classList.toggle('links-active', t === 'links');
                document.getElementById('label-arrange').classList.toggle('active', t === 'arrange');
                document.getElementById('label-links').classList.toggle('active', t === 'links');
                // v2.1.2: Sync draggable state with tool selection
                document.querySelectorAll('.sidebar-item').forEach(el => el.draggable = (t === 'arrange'));
            },

            handleMouseMove(e) {
                if (this.state.linkingSource) {
                    const startEl = document.querySelector(`[data-id="${this.state.linkingSource}"]`), r1 = startEl.getBoundingClientRect(), wr = this.screens.workspace.getBoundingClientRect();
                    const x1 = r1.left + r1.width/2 - wr.left, y1 = r1.top + r1.height/2 - wr.top;
                    this.tempPath.setAttribute("d", `M ${x1} ${y1} L ${e.clientX - wr.left} ${e.clientY - wr.top}`);
                }
            },

            handleMouseUp() { this.state.linkingSource = null; this.tempPath.setAttribute("d", ""); },

            createLink(s, t) {
                const hState = this.state.regionsState[this.state.currentRegion].hState[this.state.activeHabitat];
                if (!hState.connections.some(c => c.s === s && c.t === t)) { hState.connections.push({ s, t }); this.drawArrows(); }
            },

            drawArrows() {
                const svg = document.getElementById('connection-layer'); svg.querySelectorAll('.connection-group').forEach(g => g.remove());
                const hState = this.state.regionsState[this.state.currentRegion].hState[this.state.activeHabitat];
                if (!hState) return;
                hState.connections.forEach((c, idx) => {
                    const sEl = document.querySelector(`[data-id="${c.s}"]`), tEl = document.querySelector(`[data-id="${c.t}"]`);
                    if (!sEl || !tEl || !sEl.closest('.trophic-shelf') || !tEl.closest('.trophic-shelf')) return;
                    const r1 = sEl.getBoundingClientRect(), r2 = tEl.getBoundingClientRect(), wr = this.screens.workspace.getBoundingClientRect();
                    const x1 = r1.left + r1.width/2 - wr.left, y1 = r1.top + r1.height/2 - wr.top, x2 = r2.left + r2.width/2 - wr.left, y2 = r2.top + r2.height/2 - wr.top;
                    const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("class", "connection-group");
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute("d", `M ${x1} ${y1} Q ${(x1+x2)/2} ${(y1+y2)/2 - 20} ${x2} ${y2}`); path.setAttribute("class", "connection-arrow");
                    const del = document.createElementNS("http://www.w3.org/2000/svg", "g"); del.setAttribute("transform", `translate(${(x1+x2)/2}, ${(y1+y2)/2 - 10})`); del.style.cursor = "pointer";
                    del.onclick = () => { hState.connections.splice(idx, 1); this.drawArrows(); };
                    del.innerHTML = `<circle r="8" fill="#a33b3b"/><text fill="white" text-anchor="middle" dy="5" font-size="12">×</text>`;
                    g.appendChild(path); g.appendChild(del); svg.appendChild(g);
                });
            },

            checkJournal() {
                const hData = regions[this.state.currentRegion].habitats[this.state.activeHabitat], hState = this.state.regionsState[this.state.currentRegion].hState[this.state.activeHabitat];
                let correct = 0; hData.organisms.forEach(o => { if (hState.placements[o.id] == o.level) correct++; });
                const modal = document.getElementById('modal-feedback');
                if (correct === hData.organisms.length) {
                    document.getElementById('feedback-title').textContent = "Mastery Achieved!";
                    const multiName = hData.name.split(' ').join('<br>');
                    document.getElementById('feedback-text').innerHTML = `<div style="display:flex;gap:20px;align-items:flex-start;"><div style="transform:scale(0.5);transform-origin:top left;width:145px;height:140px;flex-shrink:0;margin-bottom:-60px;"><div class="patch-container" style="position:relative;"><div class="ribbon">${getRibbonSVG(50,70,24)}</div><div class="patch-slot" style="cursor:default;"><img src="${hData.img}" class="patch-image"></div><span class="patch-label">${multiName}</span></div></div><p style="flex:1;text-align:left;padding-top:10px;">Perfectly mapped! The ${hData.name} ecosystem logic is recorded.</p></div>`;
                    if (!this.state.regionsState[this.state.currentRegion].completed.includes(this.state.activeHabitat)) this.state.regionsState[this.state.currentRegion].completed.push(this.state.activeHabitat);
                } else {
                    document.getElementById('feedback-title').textContent = "Notes"; document.getElementById('feedback-text').textContent = `Correct: ${correct}/${hData.organisms.length}. Check level placements and links.`;
                }
                modal.classList.add('active');
            }
        };
        window.onload = () => app.init();
    </script>

name: Deploy to GitHub Pageson:push:branches:- main- stagingpermissions:contents: writepages: writeid-token: writejobs:build-and-deploy:runs-on: ubuntu-lateststeps:- name: Checkoutuses: actions/checkout@v4  - name: Setup Pages
    uses: actions/configure-pages@v4

  - name: Build Staging
    if: github.ref == 'refs/heads/staging'
    run: |
      mkdir -p build/staging
      cp index.html build/staging/

  - name: Build Production
    if: github.ref == 'refs/heads/main'
    run: |
      mkdir -p build
      cp index.html build/

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: './build'

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
